spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/orchestrator_db?createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8083

camunda:
  client:
    mode: self-managed
    grpc-address: ${CAMUNDA_GRPC_ADDRESS}
    rest-address: ${CAMUNDA_REST_ADDRESS}

logging:
  level:
    root: INFO
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    org.springframework.web.client.RestClient: DEBUG
    org.springframework.http.client: TRACE

workflow:
  storage:
    path: ${WORKFLOW_STORAGE_PATH}

binder:
  candidates:
    url: ${BINDER_CANDIDATES_URL}

operator:
  escalations:
    url: ${OPERATOR_ESCALATIONS_URL}