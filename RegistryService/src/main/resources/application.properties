spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.application.name=RegistryService

# Connessione al database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/registry_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dialect (opzionale nelle versioni recenti di Spring Boot/Hibernate)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8081
server.servlet.context-path=/api

# --- TRACCIAMENTO RICHIESTE IN INGRESSO (Ricevute dai Controller) ---
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# --- TRACCIAMENTO RICHIESTE IN USCITA (Effettuate dal RestClient) ---
logging.level.org.springframework.web.client.RestClient=DEBUG
logging.level.org.springframework.http.client=TRACE

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}