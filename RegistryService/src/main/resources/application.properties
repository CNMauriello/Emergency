spring.application.name=RegistryService

# Connessione al database
spring.datasource.url=jdbc:Mysql://localhost:3306/registry
spring.datasource.username=giuseppe
spring.datasource.password=giuseppe
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dialect (opzionale nelle versioni recenti di Spring Boot/Hibernate)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect