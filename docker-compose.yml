services:

  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka

    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - CLUSTER_ID=ciWo7IWazngRchmPESDPnd

    ports:
      - "9092:9092"

    networks:
      - emergency-network


  # ============================================================
  # MYSQL
  # ============================================================

  mysql-db:
    image: mysql:8.3.0
    container_name: mysql-db

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - ./Utility/init_dbs.sql:/docker-entrypoint-initdb.d/init_dbs.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - emergency-network


  # ============================================================
  # REGISTRY SERVICE
  # ============================================================

  registry-service:
    build:
      context: .
      dockerfile: RegistryService/Dockerfile

    container_name: registry-service

    env_file:
      - .env

    depends_on:
      mysql-db:
        condition: service_healthy

    networks:
      - emergency-network


  # ============================================================
  # AUTH SERVICE
  # ============================================================

  auth-service:
    build:
      context: .
      dockerfile: AuthMicroService/Dockerfile

    container_name: auth-service

    env_file:
      - .env

    depends_on:
      mysql-db:
        condition: service_healthy

      registry-service:
        condition: service_started

    networks:
      - emergency-network


  # ============================================================
  # GATEWAY SERVICE
  # ============================================================

  gateway-service:
    build:
      context: .
      dockerfile: GatewayService/Dockerfile

    container_name: gateway-service

    env_file:
      - .env

    ports:
      - "8090:8090"

    depends_on:
      registry-service:
        condition: service_started

    networks:
      - emergency-network


  # ============================================================
  # EMERGENCY SERVICE
  # ============================================================

  emergency-service:
    build:
      context: .
      dockerfile: EmergencyService/Dockerfile

    container_name: emergency-service

    env_file:
      - .env

    depends_on:
      mysql-db:
        condition: service_healthy

      registry-service:
        condition: service_started

      kafka:
        condition: service_started

    networks:
      - emergency-network


  # ============================================================
  # OPERATOR SERVICE
  # ============================================================

  operator-service:
    build:
      context: .
      dockerfile: OperatorService/Dockerfile

    container_name: operator-service

    env_file:
      - .env

    depends_on:
      mysql-db:
        condition: service_healthy

      registry-service:
        condition: service_started

    networks:
      - emergency-network


  # ============================================================
  # MOCK SERVICE
  # ============================================================

  mock-service:
    build:
      context: .
      dockerfile: MockService/Dockerfile

    container_name: mock-service

    env_file:
      - .env

    depends_on:
      registry-service:
        condition: service_started

    networks:
      - emergency-network


  # ============================================================
  # ELASTICSEARCH
  # ============================================================

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.0
    container_name: elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

    ports:
      - "9200:9200"
      - "9300:9300"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health > /dev/null || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - emergency-network


  # ============================================================
  # CAMUNDA 8.8.5
  #
  # Unico container Camunda:
  #   - Zeebe
  #   - Zeebe Gateway
  #   - Operate
  #   - Tasklist
  #   - REST API
  #   - gRPC API
  # ============================================================

  camunda:
    image: camunda/camunda:8.8.5
    container_name: camunda

    env_file:
      - .env

    ports:
      - "26500:26500"
      - "8080:8080"

    environment:

      # ----------------------------------------------------------
      # ELASTICSEARCH / SECONDARY STORAGE
      # ----------------------------------------------------------

      - CAMUNDA_DATA_SECONDARYSTORAGE_TYPE=elasticsearch
      - CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_CLUSTERNAME=elasticsearch
      - CAMUNDA_DATA_SECONDARYSTORAGE_ELASTICSEARCH_SECURITY_ENABLED=false

      # ----------------------------------------------------------
      # AUTHENTICATION
      # ----------------------------------------------------------

      - CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI=true

      # ----------------------------------------------------------
      # ZEEBE GATEWAY
      # ----------------------------------------------------------

      - ZEEBE_BROKER_GATEWAY_SECURITY_AUTHENTICATION_MODE=none

      # ----------------------------------------------------------
      # ELASTICSEARCH EXPORTER
      # ----------------------------------------------------------

      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200

    depends_on:
      elasticsearch:
        condition: service_healthy

    # ----------------------------------------------------------
    # CAMUNDA HEALTHCHECK
    #
    # Camunda espone l'health endpoint sul management port 9600.
    # Non serve pubblicarlo sull'host.
    # ----------------------------------------------------------

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/9600' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

    networks:
      - emergency-network


  # ============================================================
  # ORCHESTRATOR BINDER
  # ============================================================

  orchestrator-binder:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator-binder

    container_name: orchestrator-binder

    env_file:
      - .env

    ports:
      - "8082:8082"
      - "8083:8083"

    environment:

      # ----------------------------------------------------------
      # CAMUNDA 8.8 SELF-MANAGED
      # ----------------------------------------------------------

      - CAMUNDA_CLIENT_MODE=self-managed
      - CAMUNDA_CLIENT_GRPCADDRESS=http://camunda:26500
      - CAMUNDA_CLIENT_RESTADDRESS=http://camunda:8080
      - CAMUNDA_CLIENT_AUTH_METHOD=none

    depends_on:

      # Camunda deve essere realmente pronto
      camunda:
        condition: service_healthy

      mysql-db:
        condition: service_healthy

      registry-service:
        condition: service_started

      kafka:
        condition: service_started

    networks:
      - emergency-network


  # ============================================================
  # UI
  # ============================================================

  ui:
    build:
      context: ./UI
      dockerfile: Dockerfile

    container_name: emergency-ui

    ports:
      - "5173:80"

    networks:
      - emergency-network


  # ============================================================
  # DATABASE SEEDER
  # ============================================================

  db-seeder:
    image: node:18-bookworm-slim
    container_name: db-seeder

    volumes:
      - ./Utility:/app

    working_dir: /app

    env_file:
      - .env

    environment:

      # Dentro Docker utilizziamo il nome del servizio
      # e la porta interna MySQL.

      - DB_EXPOSED_HOST=mysql-db
      - DB_EXPOSED_PORT=3306

      - API_URL=http://gateway-service:8090/api/auth/register

      - MYSQL_OPTS=--skip-ssl

    command: >
      sh -c "
        apt-get update &&
        apt-get install -y default-mysql-client curl &&
        echo 'Waiting for microservices to create tables...' &&
        until mysql -h \"$$DB_EXPOSED_HOST\" -P \"$$DB_EXPOSED_PORT\" -u \"$$DB_USERNAME\" -p\"$$DB_PASSWORD\" -e \"DESCRIBE operator_db.operators;\" > /dev/null 2>&1; do
          echo 'Waiting for operator_db.operators...';
          sleep 5;
        done;
        until mysql -h \"$$DB_EXPOSED_HOST\" -P \"$$DB_EXPOSED_PORT\" -u \"$$DB_USERNAME\" -p\"$$DB_PASSWORD\" -e \"DESCRIBE auth_db.users;\" > /dev/null 2>&1; do
          echo 'Waiting for auth_db.users...';
          sleep 5;
        done;
        echo 'Tables are ready! Executing seeder scripts...';
        chmod +x run_scripts.sh &&
        ./run_scripts.sh
      "

    depends_on:

      mysql-db:
        condition: service_healthy

      gateway-service:
        condition: service_started

      auth-service:
        condition: service_started

    networks:
      - emergency-network


# ================================================================
# NETWORK
# ================================================================

networks:
  emergency-network:
    driver: bridge