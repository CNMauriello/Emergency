services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3
      - CLUSTER_ID=ciWo7IWazngRchmPESDPnd

  mysql-db:
    image: mysql:8.3.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - ./Utility/init_dbs.sql:/docker-entrypoint-initdb.d/init_dbs.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  registry-service:
    build:
      context: .
      dockerfile: RegistryService/Dockerfile
    container_name: registry-service
    env_file: .env
    depends_on:
      mysql-db:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: AuthMicroService/Dockerfile
    container_name: auth-service
    env_file: .env
    depends_on:
      mysql-db:
        condition: service_healthy
      registry-service:
        condition: service_started

  gateway-service:
    build:
      context: .
      dockerfile: GatewayService/Dockerfile
    container_name: gateway-service
    env_file: .env
    ports:
      - "8090:8090"
    depends_on:
      - registry-service

  emergency-service:
    build:
      context: .
      dockerfile: EmergencyService/Dockerfile
    container_name: emergency-service
    env_file: .env
    depends_on:
      mysql-db:
        condition: service_healthy
      registry-service:
        condition: service_started
      kafka:
        condition: service_started

  operator-service:
    build:
      context: .
      dockerfile: OperatorService/Dockerfile
    container_name: operator-service
    env_file: .env
    depends_on:
      mysql-db:
        condition: service_healthy
      registry-service:
        condition: service_started

  mock-service:
    build:
      context: .
      dockerfile: MockService/Dockerfile
    container_name: mock-service
    env_file: .env
    depends_on:
      - registry-service

  orchestrator-binder-camunda:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator-bundle
    container_name: orchestrator-binder-camunda
    env_file: .env
    depends_on:
      mysql-db:
        condition: service_healthy
      registry-service:
        condition: service_started
      kafka:
        condition: service_started

  ui:
    build:
      context: ./UI
      dockerfile: Dockerfile
    container_name: emergency-ui
    ports:
      - "5173:80"

  db-seeder:
    image: node:18-bookworm-slim
    container_name: db-seeder
    volumes:
      - ./Utility:/app
    working_dir: /app
    env_file: .env
    environment:
      - DB_EXPOSED_HOST=mysql-db
      - DB_EXPOSED_PORT=3306
      - API_URL=http://gateway-service:8090/api/auth/register
      - MYSQL_OPTS=--skip-ssl
    command: >
      sh -c "
        apt-get update && apt-get install -y default-mysql-client curl &&
        echo 'Waiting for microservices to create tables...' &&
        while ! mysql -h \"$$DB_EXPOSED_HOST\" -P \"$$DB_EXPOSED_PORT\" -u \"$$DB_USERNAME\" -p\"$$DB_PASSWORD\" -e \"DESCRIBE operator_db.operators;\" > /dev/null 2>&1; do
          sleep 5;
        done &&
        echo 'Tables are ready! Executing seeder scripts...' &&
        chmod +x run_scripts.sh &&
        ./run_scripts.sh || echo 'Seeder terminato (potrebbe aver ignorato duplicati)'
      "
    depends_on:
      mysql-db:
        condition: service_healthy
      gateway-service:
        condition: service_started
      auth-service:
        condition: service_started

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
