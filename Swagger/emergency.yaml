openapi: "3.1.0"
info:
  title: "Emergency API"
  description: "Emergency API"
  version: "1.0.0"
servers:
  - url: "http://localhost:8090"
paths:
  /api/emergencies/{id}/status:
    patch:
      summary: "PATCH api/emergencies/{id}/status"
      operationId: "updateEmergencyStatus"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdateRequestDto"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
  /api/emergencies:
    get:
      summary: "GET api/emergencies"
      operationId: "getAllEmergencies"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/EmergencyResponseDto"
  /api/emergencies/{id}:
    get:
      summary: "GET api/emergencies/{id}"
      operationId: "getEmergency"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmergencyResponseDto"
components:
  schemas:
    StatusUpdateRequestDto:
      type: "object"
      properties:
        status:
          type: "string"
          nullable: true
        workflowInstanceId:
          type: "string"
          nullable: true
    Void:
      type: "object"
      properties: { }
    EmergencyResponseDto:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
          nullable: true
        eventId:
          type: "string"
          nullable: true
        eventType:
          type: "string"
          nullable: true
        severity:
          type: "string"
          nullable: true
        status:
          type: "string"
          nullable: true
        latitude:
          type: "number"
          format: "double"
          nullable: true
        longitude:
          type: "number"
          format: "double"
          nullable: true
        workflowInstanceId:
          type: "string"
          nullable: true
        history:
          type: "array"
          nullable: true
          items:
            type: "string"