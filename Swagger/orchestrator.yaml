openapi: "3.1.0"
info:
  title: "Emergency API"
  description: "Emergency API"
  version: "1.0.0"
servers:
  - url: "http://localhost:8090"
paths:
  /api/workflows/active-version:
    put:
      summary: "PUT api/workflows/active-version"
      operationId: "changeActiveVersion"
      parameters:
        - name: "processKey"
          in: "query"
          required: true
          schema:
            type: "string"
        - name: "targetVersion"
          in: "query"
          required: true
          schema:
            type: "integer"
            format: "int32"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "object"
  /api/workflows:
    post:
      summary: "POST api/workflows"
      operationId: "uploadWorkflow"
      parameters:
        - name: "file"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "binary"
        - name: "eventType"
          in: "query"
          required: true
          schema:
            type: "string"
        - name: "severity"
          in: "query"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "object"
    get:
      summary: "GET api/workflows"
      operationId: "getAllWorkflows"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "object"
  /api/emergency-triggers:
    post:
      summary: "POST api/emergency-triggers"
      operationId: "trigger"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyEvent"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
  /api/escalations/{ticketId}/resolve:
    post:
      summary: "POST api/escalations/{ticketId}/resolve"
      operationId: "resolveEscalation"
      parameters:
        - name: "ticketId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: "string"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
components:
  schemas:
    IncidentContext:
      type: "object"
      properties:
        has_injured:
          type: "boolean"
          nullable: true
        has_unconscious:
          type: "boolean"
          nullable: true
        has_trapped:
          type: "boolean"
          nullable: true
        has_special_vehicle_involved:
          type: "boolean"
          nullable: true
    GeoPoint:
      type: "object"
      properties:
        latitude:
          type: "number"
          format: "double"
          nullable: true
        longitude:
          type: "number"
          format: "double"
          nullable: true
    EmergencyEvent:
      type: "object"
      properties:
        event_id:
          type: "string"
          nullable: true
        timestamp:
          type: "string"
          nullable: true
        emergency_category:
          type: "string"
          nullable: true
        severity:
          type: "string"
          nullable: true
        incident_context:
          nullable: true
          $ref: "#/components/schemas/IncidentContext"
        coordinates:
          nullable: true
          $ref: "#/components/schemas/GeoPoint"
        address:
          type: "string"
          nullable: true
        global_confidence:
          type: "number"
          format: "double"
          nullable: true
    Void:
      type: "object"
      properties: { }