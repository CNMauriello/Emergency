spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.address=0.0.0.0
server.port=8090
spring.application.name=gateway
spring.threads.virtual.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.http.server.reactive=INFO
logging.level.reactor.netty=INFO
logging.level.reactor.netty.http.client=ERROR

reactor.netty.http.server.accessLogEnabled=true
logging.level.reactor.netty.http.server.AccessLog=INFO

gateway.routes.auth.url=${AUTH_INTERNAL_URL}
gateway.routes.registry.url=${REGISTRY_SERVICE_URL}
gateway.routes.orchestrator.url=${ORCHESTRATOR_SERVICE_URL}
gateway.routes.emergency.url=${EMERGENCY_SERVICE_URL}
gateway.routes.operator.url=${OPERATOR_SERVICE_URL}
gateway.routes.mock.url=${MOCK_SERVICE_URL}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
