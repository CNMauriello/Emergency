apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergency-service
  namespace: assd-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emergency-service
  template:
    metadata:
      labels:
        app: emergency-service
    spec:
      containers:
        - name: emergency-service
          image: khondor/emergency-service:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: emergency-config
            - secretRef:
                name: emergency-secrets
          ports:
            - containerPort: 8084
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: emergency-service
  namespace: assd-orchestration
spec:
  ports:
    - port: 8084
      targetPort: 8084
  selector:
    app: emergency-service
