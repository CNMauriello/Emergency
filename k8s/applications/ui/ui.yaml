apiVersion: apps/v1
kind: Deployment
metadata:
  name: emergency-ui
  namespace: assd-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emergency-ui
  template:
    metadata:
      labels:
        app: emergency-ui
    spec:
      containers:
        - name: emergency-ui
          image: khondor/ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: emergency-ui
  namespace: assd-orchestration
spec:
  ports:
    - port: 5173
      targetPort: 80
  selector:
    app: emergency-ui
