apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-service
  namespace: assd-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-service
  template:
    metadata:
      labels:
        app: mock-service
    spec:
      containers:
        - name: mock-service
          image: khondor/mock-service:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: emergency-config
            - secretRef:
                name: emergency-secrets
          ports:
            - containerPort: 8089
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: mock-service
  namespace: assd-orchestration
spec:
  ports:
    - port: 8089
      targetPort: 8089
  selector:
    app: mock-service
