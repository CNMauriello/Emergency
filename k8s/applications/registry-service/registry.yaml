apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-service
  namespace: assd-orchestration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-service
  template:
    metadata:
      labels:
        app: registry-service
    spec:
      containers:
        - name: registry-service
          image: khondor/registry-service:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: emergency-config
            - secretRef:
                name: emergency-secrets
          ports:
            - containerPort: 8081
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: registry-service
  namespace: assd-orchestration
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: registry-service
