server.address=0.0.0.0
server.port=8080
spring.application.name=gateway
spring.threads.virtual.enabled=true

# Auth Service
spring.cloud.gateway.routes[0].id=AuthMicroService
spring.cloud.gateway.routes[0].uri=http://localhost:8086
spring.cloud.gateway.routes[0].predicates[0]=Path=/Auth/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/Auth/(?<segment>.*), /$\{segment}

# Registry Service
spring.cloud.gateway.routes[2].id=RegistryService
spring.cloud.gateway.routes[2].uri=http://localhost:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/Registry/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/Registry/(?<segment>.*), /$\{segment}

# Orchestrator Service
spring.cloud.gateway.routes[3].id=Orchestrator
spring.cloud.gateway.routes[3].uri=http://localhost:8083
spring.cloud.gateway.routes[3].predicates[0]=Path=/Orchestrator/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/Orchestrator/(?<segment>.*), /$\{segment}

# Emergency Manager
spring.cloud.gateway.routes[4].id=Emergency
spring.cloud.gateway.routes[4].uri=http://localhost:8084
spring.cloud.gateway.routes[4].predicates[0]=Path=/Emergency/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/Emergency/(?<segment>.*), /$\{segment}

# Token
jwt.secret=CVStBSMFRzVOozs1qq6Iefmel9cNOfWfh1OxuHW6dDB
jwt.expiration=3600000

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.http.server.reactive=INFO
logging.level.reactor.netty=INFO
logging.level.reactor.netty.http.client=ERROR

# Access Logs
reactor.netty.http.server.accessLogEnabled=true
logging.level.reactor.netty.http.server.AccessLog=INFO