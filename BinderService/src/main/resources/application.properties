spring.application.name=binder

# Porta del server (diversa dalla 8080 del Registro)
server.port=8081
server.servlet.context-path=/api

# ==========================================
# CONFIGURAZIONI DI DEBUG E TRACCIAMENTO DI RETE
# ==========================================

# Tracciamento delle richieste in ingresso (Ricevute dai Controller del Binder)
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Tracciamento delle chiamate in uscita (Effettuate dal Binder verso il Registro)
logging.level.org.springframework.web.client.RestClient=DEBUG
logging.level.org.springframework.http.client=TRACE