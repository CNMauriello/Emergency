spring.application.name=operator-service
server.port=8087

spring.datasource.url=jdbc:mysql://localhost:3306/registry
spring.datasource.username=emergency
spring.datasource.password=Emergency123456@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.web=INFO
logging.level.com.spendy.operator=DEBUG

# Tracciamento delle richieste in ingresso (Ricevute dai Controller del Binder)
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Tracciamento delle chiamate in uscita (Effettuate dal Binder verso il Registro)
logging.level.org.springframework.web.client.RestClient=DEBUG
logging.level.org.springframework.http.client=TRACE